#laptop-Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laptop-deployment
  labels:
    app: laptop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laptop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: laptop
    spec:
      containers:
        - name: nginx-cont
          image: nginx:latest
          ports:
            - name: nginx-port
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Gi"
            limits:
              cpu: "200m"
              memory: "128Gi"
              