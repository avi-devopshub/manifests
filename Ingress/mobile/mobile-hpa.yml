#mobile-HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mobile-hpa
  labels:
    env: mobile
spec:
  scaleTargetRef:
    apiVersion: apps/v2
    kind: Deployment
    name: mobile-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: CPU
        target:
          type: Utilization
          averageUtilization: 50
    