#Home-Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-deployment
  labels:
    app: home
spec:
  replicas: 2
  selector:
    matchLabels:
      app: home
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: home
    spec:
      containers:
        - name: apache-cont
          image: httpd:latest
          ports:
            - name: apache-port
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Gi"
            limits:
              cpu: "200m"
              memory: "128Gi'
              