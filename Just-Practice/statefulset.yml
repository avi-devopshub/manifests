apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-ss
  labels:
    app: ss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ss
  template:
    metadata:
      labels:
        app: ss
    spec:
      containers:
        - name: my-container
          image: mysql:8
          ports:
            - containerPort: 80
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
            - name: MYSQL_DATABASE
              value: "test"
            - name:  MYSQL_USER
              value: "avinash
            - name: MYSQL__PASWORD
              value: "123456"