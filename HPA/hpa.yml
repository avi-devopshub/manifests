#HorizontalPodAutoscaler autoscaling/v2
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dev-hpa
  labels:
    env: dev
  namespace: dev
spec: 
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-deploy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilizaTION: 30