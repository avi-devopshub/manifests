#Deployment apps/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deploy
  labels:
    env: dev
  namespace: dev
spec:
  replicas: 10
  selector:
    matchLabels:
      env: dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 2
  template:
    metadata:
      labels:
        env: dev
    spec:
      containers:
        - name: nginx-cont
          image: nginx:1.30
          ports:
            - name: nginx-port
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"