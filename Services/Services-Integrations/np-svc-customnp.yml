#Pod
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: web
spec:
  containers:
    - name: nginx-cont
      image: nginx
      ports:
        - name: nginx-port
          containerPort: 80
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: npsvc-custom
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: svc-port
      port: 80
      targetPort: 80
      nodePort: 30000 #30000 to 32767